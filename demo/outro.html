<!doctype html><html><head><meta charset='utf-8'><style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1440px;height:900px;background:#1a1d21;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#e8e8e8;overflow:hidden}
.scene{position:absolute;inset:0;display:none;padding:54px 80px;opacity:0;transition:opacity .6s}
.scene.on{display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:1}
.logo{font-size:64px;font-weight:800;color:#fff;margin-bottom:28px}
.tag{font-size:42px;line-height:1.35;color:#fff;font-weight:300;text-align:center}
.tag b{font-weight:700;color:#36c5ab}
.sub{margin-top:32px;font-size:22px;color:#9aa0a6;text-align:center}
.caption{font-size:32px;color:#fff;font-weight:300;margin-bottom:24px;text-align:center}
.term{background:#0c0c0c;border-radius:12px;padding:28px 34px;font-family:'SFMono-Regular',Consolas,monospace;font-size:18px;line-height:1.5;color:#d6f5e3;white-space:pre-wrap;text-align:left;width:1180px;height:560px;overflow:hidden;box-shadow:0 0 0 1px #2a2a2a,0 24px 60px rgba(0,0,0,.5)}
.term .pass{color:#36c5ab;font-weight:800}</style></head><body><section class="scene" data-dur="30"><div class="caption">The funder verifies the letter — without trusting the sender</div><div class="term" id="t1"></div></section><section class="scene" data-dur="22"><div class="caption">A workforce board verifies the plan — against the U.S. DOL training list</div><div class="term" id="t2"></div></section><section class="scene" data-dur="12"><div class="logo">📄 GrantScribe</div>
    <div class="tag">We deleted the blank page.<br>And we invented <b>the receipt</b> — twice.</div>
    <div class="sub">Two verifiable receipts, one pattern: draft, then prove. · Slack Agent for Good</div></section><script>const T1="Parsed receipt:\n  generated_at: 2026-06-06T08:05:26Z\n  grant_source: grants.gov\n  opportunity_number: DOL-OESE-33831\n  grant_url: https://www.grants.gov/search-results-detail/361808\n  close_date: 06/09/2026\n  grant_canonical_sha256: 8e1c8ad061d38e9911e82c2cfdd97fa53d0a0317d4d657a57b85a7005e253b5c\n  org_report_sha256: b5e05398416711b948e6081239129d4afd66dde9dd70af32f705b9b2f3165a85\n  receipt_id: GS-984bcfc-f7a96e\n  verify_command: python verify_loi.py --letter <file>\n\nReceipt verification: PASS\n\n  \u2713 receipt has all required fields\n      ok\n  \u2713 grant_canonical_sha256 matches the receipt's own identifier fields\n      ok\n  \u2713 grant_url points at grants.gov\n      https://www.grants.gov/search-results-detail/361808\n  \u2713 live grants.gov payload hashes to the same grant_canonical_sha256\n      ok \u2014 receipt anchored in live grants.gov data\n\nLive grants.gov record at verification time:\n  title:              Innovative Approaches to Literacy 84.215G\n  agency:             Office of Elementary and Secondary Education\n  opportunity_number: DOL-OESE-33831\n  url:                https://www.grants.gov/search-results-detail/361808\n  close_date:         06/09/2026\n",T2="Parsed receipt:\n  generated_at: 2026-06-06T08:05:39Z\n  training_source: CareerOneStop (U.S. DOL ETA / ETPL)\n  goal_occupation: Registered Nurses (O*NET 29-1141.00)\n  detail_id: 304905513801\n  program: Registered Nursing/Registered Nurse\n  school: Galen College of Nursing\n  credential: Associate Degree\n  cip_code: 513801\n  program_canonical_sha256: d52f3ed6a6f0ab8e1e1722581fce697948fe6a819880d1f5e044fa872e7ebe91\n  student_story_sha256: 6a7ef6113e312ffadf6a4e1416c64f8e6ccd0398874cf39a9803c68a90f3a1ce\n  receipt_id: GS-984bcfc-f5dcfe\n  verify_command: python verify_pathway.py --plan <file>\n\nReceipt verification: PASS\n\n  \u2713 receipt has all required fields\n      ok\n  \u2713 program_canonical_sha256 matches the receipt's own program fields\n      ok\n  \u2713 training_source is CareerOneStop\n      CareerOneStop (U.S. DOL ETA / ETPL)\n  \u2713 live CareerOneStop record hashes to the same program_canonical_sha256\n      ok \u2014 receipt anchored in live ETPL data\n\nLive CareerOneStop ETPL record at verification time:\n  program:    Registered Nursing/Registered Nurse\n  school:     Galen College of Nursing\n  credential: Associate Degree\n  detail_id:  304905513801\n  location:   Cincinnati, OH\n";const scenes=[...document.querySelectorAll('.scene')];
function colorize(t){return t.replace(/PASS/g,'<span class="pass">PASS</span>').replace(/✓/g,'<span class="pass">✓</span>');}
function typeInto(el,text){let i=0;el.innerHTML='';const step=()=>{if(i>=text.length){el.innerHTML=colorize(text);return;}el.textContent=text.slice(0,i);i+=Math.max(3,Math.floor(text.length/200));el.scrollTop=el.scrollHeight;setTimeout(step,16);};step();}
let idx=0;function play(){if(idx>=scenes.length){document.body.setAttribute('data-done','1');return;}
scenes.forEach(s=>s.classList.remove('on'));const s=scenes[idx];s.classList.add('on');
const t=s.querySelector('.term');if(t){typeInto(t,t.id==='t1'?T1:T2);}idx++;setTimeout(play,parseFloat(s.dataset.dur)*1000);}window.__start=play;</script></body></html>
