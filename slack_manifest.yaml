display_information:
  name: GrantScribe
  description: Removes the money barrier — finds federal grants and drafts the LOI in your voice, plus real funded training to a credential near you.
  background_color: "#1a4d2e"
features:
  bot_user:
    display_name: grantscribe
    always_online: true
  slash_commands:
    - command: /setreport
      description: Set your org's voice/context (paste a prior grant or annual report)
      usage_hint: (opens a paste dialog) — or `/setreport <report text>`
      should_escape: false
    - command: /grants
      description: Find federal grants for your work + draft the LOI in your voice
      usage_hint: what your org does + what you need
      should_escape: false
    - command: /scholarships
      description: Why there's no honest scholarship search yet — and the funded routes to use instead
      usage_hint: (explains /pathway, /training, /grants)
      should_escape: false
    - command: /learn
      description: Find free ways to learn something
      usage_hint: what you want to learn
      should_escape: false
    - command: /training
      description: Find real accredited training programs + the credential they grant (U.S. DOL CareerOneStop)
      usage_hint: what to train for — e.g. nursing near 45241
      should_escape: false
    - command: /pathway
      description: Map a goal job to the credential you need + real programs near you that grant it
      usage_hint: the job you want — e.g. registered nurse near 45241
      should_escape: false
    - command: /ask
      description: Ask a learning question, answered from free open textbooks
      usage_hint: your question
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
